<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#18181b">
  <title>IluMap</title>
  <meta name="description" content="IluMap — open-source vector map editor for game worlds. map.json is the source of truth.">
  <link rel="help" type="text/plain" href="llms.txt" title="Instructions for AI agents">
  <link rel="alternate" type="text/markdown" href="docs/AGENT.md" title="IluMap for AI agents">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23ffd23f'/%3E%3Cpath d='M6 10l6-3 8 3 6-3v15l-6 3-8-3-6 3z' fill='none' stroke='%231c1917' stroke-width='2.2' stroke-linejoin='round'/%3E%3Cpath d='M12 7v15M20 10v15' stroke='%231c1917' stroke-width='2.2'/%3E%3C/svg%3E">
  <script>
    // apply the UI language before first paint (see src/app/i18n/index.js)
    (function () {
      var l = null;
      try { l = localStorage.getItem('ilumap.lang'); } catch (e) { /* storage disabled */ }
      if (l !== 'ru' && l !== 'en') l = 'en';
      document.documentElement.lang = l;
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Caveat:wght@600&display=swap">
  <link rel="stylesheet" href="src/app/styles.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar" aria-label="Maps" data-i18n-aria-label="sidebar.aria"></aside>

    <main id="stage">
      <svg id="canvas" tabindex="0" xmlns="http://www.w3.org/2000/svg" aria-label="Map canvas" data-i18n-aria-label="app.canvas"></svg>

      <!-- floating chrome (everything with .chrome sits on top of the canvas) -->
      <button id="sidebar-open" class="chrome fab" type="button" title="Open sidebar (Ctrl+B)" aria-label="Open sidebar" data-i18n-title="sidebar.open" data-i18n-aria-label="sidebar.openAria" hidden></button>
      <div id="title-pill" class="chrome pill"></div>
      <div id="panel-toggles" class="chrome pill" role="toolbar" aria-label="Panels" data-i18n-aria-label="panels.toggles"></div>
      <div id="history-pill" class="chrome pill" role="toolbar" aria-label="History" data-i18n-aria-label="history.aria"></div>
      <div id="tool-keys" aria-live="polite"></div>

      <nav id="toolbar" class="chrome tb-stack" aria-label="Tools" data-i18n-aria-label="toolbar.tools"></nav>

      <div id="dock-left" class="dock-col"></div>
      <div id="float-layer"></div>

      <div id="hud" class="chrome hud" hidden></div>
      <div id="dock" class="chrome pill" role="toolbar" aria-label="Layer dock" data-i18n-aria-label="dock.aria"></div>

      <div id="nav-corner" class="chrome">
        <div id="scalebar"><div class="bar"></div><div class="lbl"></div></div>
        <div id="minimap" class="card" title="Minimap — click or drag to navigate" data-i18n-title="app.minimap"></div>
      </div>
      <div id="coords" class="chrome mono" aria-live="off"></div>
      <div id="zoom-pill" class="chrome pill" role="toolbar" aria-label="View options and zoom" data-i18n-aria-label="zoom.aria"></div>

      <div id="drop-hint" data-i18n-html="app.dropHint">Drop a <b>map.json</b> to open it as a local map, or an <b>image</b> to use as background</div>
    </main>
    <aside id="rightbar" aria-label="Points, inspector and style" data-i18n-aria-label="rightbar.aria"></aside>
  </div>
  <div id="menus"></div>
  <div id="dialogs"></div>
  <div id="toasts" aria-live="polite"></div>
  <noscript>IluMap needs JavaScript (ES modules). Serve this folder over HTTP, e.g. <code>python -m http.server</code>. / Для IluMap нужен JavaScript (ES-модули): откройте папку через HTTP-сервер, например <code>python -m http.server</code>.</noscript>
  <script type="module" src="src/app/main.js"></script>
</body>
</html>
